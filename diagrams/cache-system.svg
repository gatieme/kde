<text x="3132.425" y="294" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;Unified cache directory (output/)&quot;</text>
<text x="3442.25" y="294" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;Auto-created directories and files&quot;</text>
<text x="3734.2000000000003" y="294" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;Persistent storage, reusable&quot;</text>
<text x="3442.25" y="126" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;Easy cleanup with git clean -fdX&quot;</text>
<text x="511.725" y="126" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;LKML Cache (output/lkml/)&lt;br/&gt;- Grouped by message ID&lt;br/&gt;- Auto-created directories&lt;br/&gt;- Supports .cover and .mbx files&quot;</text>
<text x="1529.4" y="126" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;RSS Cache (output/rss/)&lt;br/&gt;- MD5 hash naming based on article URL&lt;br/&gt;- Unified .txt format&lt;br/&gt;- Contains metadata (title, link, source, time)&quot;</text>
<text x="2511.3250000000003" y="126" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;CGit Cache (output/cgit/)&lt;br/&gt;- Grouped by commit ID&lt;br/&gt;- Auto-created directories&lt;br/&gt;- Supports commit files&quot;</text>
</svg>
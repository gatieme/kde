<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1209.75 480" width="1209.75" height="480" style="--bg:#ffffff;--fg:#1f2328;--line:#d1d9e0;--accent:#0969da;--muted:#59636e;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 30%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="4.8" refX="8" refY="2.4" orient="auto">
    <polygon points="0 0, 8 2.4, 0 4.8" fill="var(--_arrow)" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="4.8" refX="0" refY="2.4" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.4, 8 4.8" fill="var(--_arrow)" />
  </marker>
</defs>
<rect x="40" y="40" width="450.1" height="400" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
<rect x="40" y="40" width="450.1" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
<text x="52" y="54" dy="0.35em" font-size="12" font-weight="600" fill="var(--_text-sec)">&quot;LKML Agent 工作流&lt;br/&gt;LangGraph StateGraph&quot;</text>
<rect x="590.0999999999999" y="182" width="579.65" height="116" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
<rect x="590.0999999999999" y="182" width="579.65" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
<text x="602.0999999999999" y="196" dy="0.35em" font-size="12" font-weight="600" fill="var(--_text-sec)">&quot;磁盘缓存系统&quot;</text>
<polyline points="265.05,410 610.1,410 610.1,258" fill="none" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="4 4" marker-end="url(#arrowhead)" />
<polyline points="265.05,124 265.05,164" fill="none" stroke="var(--_line)" stroke-width="0.75" marker-end="url(#arrowhead)" />
<polyline points="265.05,200 265.05,240" fill="none" stroke="var(--_line)" stroke-width="0.75" marker-end="url(#arrowhead)" />
<polyline points="265.05,276 265.05,316" fill="none" stroke="var(--_line)" stroke-width="0.75" marker-end="url(#arrowhead)" />
<polyline points="265.05,352 265.05,392" fill="none" stroke="var(--_line)" stroke-width="0.75" marker-end="url(#arrowhead)" />
<rect x="610.1" y="240" width="539.6500000000001" height="36" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
<rect x="84.6" y="88" width="360.90000000000003" height="36" rx="0" ry="0" fill="#ffebee" stroke="#c62828" stroke-width="0.75" />
<rect x="84.6" y="164" width="360.90000000000003" height="36" rx="0" ry="0" fill="#e3f2fd" stroke="#1565c0" stroke-width="0.75" />
<rect x="91.75" y="240" width="346.6" height="36" rx="0" ry="0" fill="#f3e5f5" stroke="#4a148c" stroke-width="0.75" />
<rect x="56" y="316" width="418.1" height="36" rx="0" ry="0" fill="#e8f5e9" stroke="#1b5e20" stroke-width="0.75" />
<rect x="120.35" y="392" width="289.40000000000003" height="36" rx="0" ry="0" fill="#e1f5fe" stroke="#0277bd" stroke-width="0.75" />
<text x="879.9250000000001" y="258" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;output/lkml/&lt;message-id&gt;/&lt;br/&gt;&lt;message-id&gt;.cover&lt;br/&gt;&lt;message-id&gt;.mbx&quot;</text>
<text x="265.05" y="106" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;fetch_patch&lt;br/&gt;- b4 am&lt;br/&gt;- 进度条&lt;br/&gt;- 超时处理&quot;</text>
<text x="265.05" y="182" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;parse_patch&lt;br/&gt;- 提取作者&lt;br/&gt;- 提取日期&lt;br/&gt;- 提取主题&quot;</text>
<text x="265.05" y="258" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;generate_summary&lt;br/&gt;- AI 摘要&lt;br/&gt;- 300 字限制&quot;</text>
<text x="265.05" y="334" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;analyze_patch&lt;br/&gt;- AI 分析&lt;br/&gt;- 技术影响&lt;br/&gt;仅 detail 级别&quot;</text>
<text x="265.05" y="410" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;output_results&lt;br/&gt;- Markdown 表格输出&quot;</text>
</svg>
<rect x="184.7" y="392" width="346.6" height="36" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
<text x="908.525" y="258" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;output/lkml/&lt;message-id&gt;/&quot;</text>
<text x="1228.55" y="228" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;&lt;message-id&gt;.cover&quot;</text>

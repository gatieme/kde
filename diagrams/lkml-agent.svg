<rect x="70.30000000000001" y="88" width="360.90000000000003" height="36" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
<rect x="66.72500000000002" y="164" width="368.05" height="36" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
<rect x="59.57500000000002" y="240" width="382.35" height="36" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
<rect x="56" y="316" width="389.50000000000006" height="36" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
<rect x="84.60000000000002" y="392" width="332.3" height="36" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
<text x="751.225" y="258" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;output/lkml/&lt;message-id&gt;/&lt;br/&gt;.cover .mbx&quot;</text>
<text x="250.75000000000003" y="106" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;fetch_patch&lt;br/&gt;b4 am, progress bar, timeout&quot;</text>
<text x="250.75000000000003" y="182" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;parse_patch&lt;br/&gt;extract author, date, subject&quot;</text>
<text x="250.75000000000003" y="258" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;generate_summary&lt;br/&gt;AI summary, 300 char limit&quot;</text>
<text x="250.75000000000003" y="334" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;analyze_patch&lt;br/&gt;AI analysis, detail level only&quot;</text>
<text x="250.75000000000003" y="410" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;output_results&lt;br/&gt;Markdown table output&quot;</text>
</svg>
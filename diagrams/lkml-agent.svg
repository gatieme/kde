<text x="358" y="182" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;parse_patch&lt;br/&gt;- Extract author&lt;br/&gt;- Extract date&lt;br/&gt;- Extract subject&quot;</text>
<text x="358" y="258" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;generate_summary&lt;br/&gt;- AI summary&lt;br/&gt;- 300 char limit&quot;</text>
<text x="358" y="334" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;analyze_patch&lt;br/&gt;- AI analysis&lt;br/&gt;- Technical impact&lt;br/&gt;(detail level only)&quot;</text>
<text x="358" y="410" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;output_results&lt;br/&gt;- Markdown table output&quot;</text>

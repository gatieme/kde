<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&amp;display=swap');
      .title { font-family: 'Comic Neue', cursive; font-size: 32px; font-weight: bold; text-anchor: middle; }
      .label { font-family: 'Comic Neue', cursive; font-size: 16px; text-anchor: middle; dominant-baseline: middle; }
      .box { stroke: #1971c2; stroke-width: 2; fill: #a5d8ff; rx: 10; ry: 10; }
      .cache-box { stroke: #2f9e44; stroke-width: 2; fill: #b2f2bb; rx: 10; ry: 10; }
      .arrow { stroke: #1e1e1e; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1e1e1e" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Title -->
  <text x="600" y="80" class="title">LKML Agent Workflow</text>

  <!-- Workflow Boxes -->
  <rect x="50" y="150" width="180" height="80" class="box" />
  <text x="140" y="190" class="label">fetch_patch</text>

  <rect x="270" y="150" width="180" height="80" class="box" />
  <text x="360" y="190" class="label">parse_patch</text>

  <rect x="490" y="150" width="180" height="80" class="box" />
  <text x="580" y="190" class="label">generate_summary</text>

  <rect x="710" y="150" width="180" height="80" class="box" />
  <text x="800" y="190" class="label">analyze_patch</text>

  <rect x="930" y="150" width="180" height="80" class="box" />
  <text x="1020" y="190" class="label">output_results</text>

  <!-- Cache Box -->
  <rect x="490" y="400" width="180" height="80" class="cache-box" />
  <text x="580" y="440" class="label">Cache</text>

  <!-- Arrows - Horizontal Flow -->
  <line x1="230" y1="190" x2="270" y2="190" class="arrow" />
  <line x1="450" y1="190" x2="490" y2="190" class="arrow" />
  <line x1="670" y1="190" x2="710" y2="190" class="arrow" />
  <line x1="890" y1="190" x2="930" y2="190" class="arrow" />

  <!-- Arrows - To Cache -->
  <path d="M 140 230 L 140 350 L 490 440" class="arrow" fill="none" />
  <path d="M 1020 230 L 1020 350 L 670 440" class="arrow" fill="none" />

  <!-- Annotations -->
  <text x="140" y="270" class="label" style="font-size: 12px;">b4 tool</text>
  <text x="360" y="270" class="label" style="font-size: 12px;">metadata</text>
  <text x="580" y="270" class="label" style="font-size: 12px;">AI summary</text>
  <text x="800" y="270" class="label" style="font-size: 12px;">detail level</text>
  <text x="1020" y="270" class="label" style="font-size: 12px;">Markdown</text>
  <text x="580" y="510" class="label" style="font-size: 12px;">output/lkml/&lt;msg-id&gt;/</text>
</svg>

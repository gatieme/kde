<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2086.4 176" width="2086.4" height="176" style="--bg:#ffffff;--fg:#1f2328;--line:#d1d9e0;--accent:#0969da;--muted:#59636e;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 30%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="4.8" refX="8" refY="2.4" orient="auto">
    <polygon points="0 0, 8 2.4, 0 4.8" fill="var(--_arrow)" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="4.8" refX="0" refY="2.4" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.4, 8 4.8" fill="var(--_arrow)" />
  </marker>
</defs>
<rect x="40" y="40" width="2006.4" height="96" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
<rect x="40" y="40" width="2006.4" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
<text x="52" y="54" dy="0.35em" font-size="12" font-weight="600" fill="var(--_text-sec)">&quot;Disk Cache System&quot;</text>
<rect x="56" y="88" width="632.6" height="36" rx="0" ry="0" fill="#e1f5fe" stroke="#0277bd" stroke-width="0.75" />
<rect x="712.5999999999999" y="88" width="675.5" height="36" rx="0" ry="0" fill="#f3e5f5" stroke="#4a148c" stroke-width="0.75" />
<rect x="1412.1" y="88" width="618.3000000000001" height="36" rx="0" ry="0" fill="#fff3e0" stroke="#e65100" stroke-width="0.75" />
<text x="372.3" y="106" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;LKML Cache (output/lkml/)&lt;br/&gt;- 按消息 ID 分组存储&lt;br/&gt;- 自动创建目录&lt;br/&gt;- 支持 .cover 和 .mbx 文件&quot;</text>
<text x="1050.35" y="106" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;RSS Cache (output/rss/)&lt;br/&gt;- 基于文章链接的 MD5 哈希命名&lt;br/&gt;- 统一 .txt 格式&lt;br/&gt;- 包含元数据（标题、链接、来源、时间）&quot;</text>
<text x="1721.25" y="106" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;CGit Cache (output/cgit/)&lt;br/&gt;- 按 commit ID 分组存储&lt;br/&gt;- 自动创建目录&lt;br/&gt;- 支持 commit 文件&quot;</text>
</svg>
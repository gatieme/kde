<text x="311.525" y="410" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;generate_summaries&lt;br/&gt;- AI 摘要&lt;br/&gt;- 分类&quot;</text>
<text x="311.525" y="486" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;output_results&lt;br/&gt;- Markdown 格式输出&quot;</text>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="600.0" y="50.0" font-size="32" fill="#1e1e1e" text-anchor="middle" dy="0.9em" style="opacity: 1.0;">Disk Cache System</text>
  <rect x="400" y="150" width="400" height="150" rx="30" ry="30" fill="#a5d8ff" stroke="#1971c2" stroke-width="2" style="opacity: 1.0;"/>
  <text x="410" y="160.0" font-size="24" fill="#1e1e1e" text-anchor="start" dy="0.9em" style="opacity: 1.0;">LKML Cache</text>
  <text x="410" y="200.0" font-size="16" fill="#1e1e1e" text-anchor="start" dy="0.9em" style="opacity: 1.0;">Location: output/lkml/</text>
  <text x="410" y="225.0" font-size="16" fill="#1e1e1e" text-anchor="start" dy="0.9em" style="opacity: 1.0;">Organization: Group by message ID</text>
  <text x="410" y="250.0" font-size="16" fill="#1e1e1e" text-anchor="start" dy="0.9em" style="opacity: 1.0;">Files: .cover, .mbx files</text>
  <text x="410" y="275.0" font-size="16" fill="#1e1e1e" text-anchor="start" dy="0.9em" style="opacity: 1.0;">Features: Auto-create directories</text>
  <rect x="400" y="350" width="400" height="150" rx="30" ry="30" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2" style="opacity: 1.0;"/>
  <text x="410" y="360.0" font-size="24" fill="#1e1e1e" text-anchor="start" dy="0.9em" style="opacity: 1.0;">RSS Cache</text>
  <text x="410" y="400.0" font-size="16" fill="#1e1e1e" text-anchor="start" dy="0.9em" style="opacity: 1.0;">Location: output/rss/</text>
  <text x="410" y="425.0" font-size="16" fill="#1e1e1e" text-anchor="start" dy="0.9em" style="opacity: 1.0;">Naming: MD5 hash naming</text>
  <text x="410" y="450.0" font-size="16" fill="#1e1e1e" text-anchor="start" dy="0.9em" style="opacity: 1.0;">Format: .txt format</text>
  <text x="410" y="475.0" font-size="16" fill="#1e1e1e" text-anchor="start" dy="0.9em" style="opacity: 1.0;">Features: Metadata included</text>
  <rect x="400" y="550" width="400" height="150" rx="30" ry="30" fill="#ffd43b" stroke="#f08c00" stroke-width="2" style="opacity: 1.0;"/>
  <text x="410" y="560.0" font-size="24" fill="#1e1e1e" text-anchor="start" dy="0.9em" style="opacity: 1.0;">CGit Cache</text>
  <text x="410" y="600.0" font-size="16" fill="#1e1e1e" text-anchor="start" dy="0.9em" style="opacity: 1.0;">Location: output/cgit/</text>
  <text x="410" y="625.0" font-size="16" fill="#1e1e1e" text-anchor="start" dy="0.9em" style="opacity: 1.0;">Organization: Group by commit ID</text>
  <text x="410" y="650.0" font-size="16" fill="#1e1e1e" text-anchor="start" dy="0.9em" style="opacity: 1.0;">Files: commit files</text>
  <text x="410" y="675.0" font-size="16" fill="#1e1e1e" text-anchor="start" dy="0.9em" style="opacity: 1.0;">Features: Auto-create directories</text>
</svg>
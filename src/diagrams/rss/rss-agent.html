<div class="toast" id="toast"></div>

<script>
  function showToast(msg, duration = 2000) {
    const toast = document.getElementById('toast');
    toast.textContent = msg; toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), duration);
  }
  function copySVG() {
    const svg = document.getElementById('archSvg');
    const svgData = new XMLSerializer().serializeToString(svg);
    navigator.clipboard.writeText(svgData).then(() => showToast('✓ SVG 已复制到剪贴板')).catch(() => {
      const ta = document.createElement('textarea'); ta.value = svgData;
      document.body.appendChild(ta); ta.select(); document.execCommand('copy');
      document.body.removeChild(ta); showToast('✓ SVG 已复制到剪贴板');
    });
  }
  function exportPNG() {
    const svg = document.getElementById('archSvg');
    const svgData = new XMLSerializer().serializeToString(svg);
    const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(svgBlob);
    const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d'); const img = new Image();
    canvas.width = 1100 * 2; canvas.height = 880 * 2;
    img.onload = function() {
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      canvas.toBlob(function(blob) {
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
        a.download = 'rss-agent.png'; a.click(); URL.revokeObjectURL(a.href);
        URL.revokeObjectURL(url); showToast('✓ PNG 已下载');
      }, 'image/png');
    };
    img.onerror = function() { showToast('⚠ PNG 导出失败'); URL.revokeObjectURL(url); };
    img.src = url;
  }
  function exportPDF() {
    const svg = document.getElementById('archSvg');
    const svgData = new XMLSerializer().serializeToString(svg);
    const win = window.open('', '_blank');
    win.document.write('<html><head><title>RSS Agent Architecture</title><style>body { margin: 0; background: #fff; } @media print { body { margin: 0; } }</style></head><body>' + svgData + '</body></html>');
    win.document.close(); setTimeout(() => { win.print(); }, 500); showToast('✓ PDF 导出窗口已打开');
  }
</script>

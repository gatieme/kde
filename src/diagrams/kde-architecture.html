<style>
  /* ===== 全局样式 (扁平化图标风格) ===== */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #ffffff;
    color: #1e293b;
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
  }

  /* ===== 导出工具栏 (白色扁平风格) ===== */
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    gap: 10px;
    padding: 10px 16px;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    width: 100%;
    max-width: 1200px;
    justify-content: center;
  }

  .toolbar button {
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    font-size: 13px;
    font-weight: 500;
    padding: 8px 16px;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    background: #f8fafc;
    color: #475569;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .toolbar button:hover {
    background: #2563eb;
    border-color: #2563eb;
    color: #ffffff;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
  }

  .toolbar button:active {
    transform: translateY(0);
  }

  .toolbar button .icon {
    font-size: 15px;
  }

  /* ===== 标题区域 ===== */
  .header {
    text-align: center;
    margin-bottom: 16px;
  }

  .header h1 {
    font-size: 22px;
    font-weight: 700;
    color: #1e293b;
    letter-spacing: -0.5px;
    margin-bottom: 4px;
  }

  .header p {
    font-size: 13px;
    color: #94a3b8;
    font-weight: 400;
  }

  /* ===== SVG 容器 (白色扁平风格) ===== */
  .svg-container {
    width: 100%;
    max-width: 1200px;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
  }

  .svg-container svg {
    width: 100%;
    height: auto;
  }

  .svg-container svg text {
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
  }

  /* ===== Toast 提示 (白色扁平风格) ===== */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 12px 24px;
    color: #1e293b;
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    font-size: 13px;
    z-index: 1000;
    transition: transform 0.3s ease, opacity 0.3s ease;
    opacity: 0;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
  }

  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
</style>

<!-- Toast 提示 -->
<div class="toast" id="toast"></div>

<script>
  // ===== Toast 提示 =====
  function showToast(msg, duration = 2000) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), duration);
  }

  // ===== 复制 SVG =====
  function copySVG() {
    const svg = document.getElementById('archSvg');
    const svgData = new XMLSerializer().serializeToString(svg);
    navigator.clipboard.writeText(svgData).then(() => {
      showToast('✓ SVG 已复制到剪贴板');
    }).catch(() => {
      const textarea = document.createElement('textarea');
      textarea.value = svgData;
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);
      showToast('✓ SVG 已复制到剪贴板');
    });
  }

  // ===== 导出 PNG =====
  function exportPNG() {
    const svg = document.getElementById('archSvg');
    const svgData = new XMLSerializer().serializeToString(svg);
    const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(svgBlob);

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const img = new Image();

    const scale = 2;
    canvas.width = 1100 * scale;
    canvas.height = 750 * scale;

    img.onload = function() {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      canvas.toBlob(function(blob) {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'kde-architecture.png';
        a.click();
        URL.revokeObjectURL(a.href);
        URL.revokeObjectURL(url);
        showToast('✓ PNG 已下载');
      }, 'image/png');
    };

    img.onerror = function() {
      showToast('⚠ PNG 导出失败，请尝试 Copy 方式');
      URL.revokeObjectURL(url);
    };

    img.src = url;
  }

  // ===== 导出 PDF (使用浏览器打印) =====
  function exportPDF() {
    const svg = document.getElementById('archSvg');
    const svgData = new XMLSerializer().serializeToString(svg);

    const win = window.open('', '_blank');
    win.document.write('<html><head><title>KDE Architecture</title>' +
      '<style>body { margin: 0; background: #fff; } ' +
      '@media print { body { margin: 0; } }</style></head>' +
      '<body>' + svgData + '</body></html>');
    win.document.close();
    setTimeout(() => { win.print(); }, 500);
    showToast('✓ PDF 导出窗口已打开');
  }
</script>
